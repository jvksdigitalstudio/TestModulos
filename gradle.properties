# OlySf2 Sampler — Professional Synth/Sampler Module (YeiViKas Digital Company)
# Módulo reutilizable, NO aplicación independiente: no declara
# applicationId ni configuración de launcher.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Identidad del módulo (usada por build-logic para validar consistencia)
olysf2sampler.namespace=com.yeivikas.olysf2sampler
olysf2sampler.minSdk=26
olysf2sampler.targetSdk=35
olysf2sampler.compileSdk=35
olysf2sampler.ndkVersion=27.0.12077973
olysf2sampler.cmakeVersion=3.22.1
olysf2sampler.cppStandard=20
olysf2sampler.abiFilters=arm64-v8a
